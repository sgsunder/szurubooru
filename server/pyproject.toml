[project]
name = "szurubooru"
version = "2.6"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.1.4",
    "coloredlogs>=15.0.1",
    "numpy>=2.0.0",
    "pillow>=11.2.1",
    "pillow-heif>=1.3.0; sys_platform != 'linux' or platform_machine != 'armv7l'",
    "pillow-heif>=1.3.0,<=1.4.0; sys_platform == 'linux' and platform_machine == 'armv7l'",
    "pillow-avif-plugin>=1.4.6",
    "psycopg2-binary",
    "pynacl",
    "pyRFC3339",
    "pytz",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "videohash>=3.0.1",
    "yt-dlp",
]

[dependency-groups]
server = [
    "alembic",
    "waitress",
]
dev = [
    "flake8-pyproject",
    "flake8",
    "freezegun",
    "hupper",
    "pycodestyle",
    "pytest-cov",
    "pytest-pgsql",
    "pytest-xdist",
    "pytest",
]

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.flake8]
filename = "szurubooru/"
exclude = ["__pycache__"]
ignore = ["F401", "W503", "W504", "E203", "E231"]
max-line-length = 79

[tool.pdm]
distribution = false

[tool.black]
line-length = 79

[tool.isort]
known_first_party = ["szurubooru"]
known_third_party = ["PIL", "alembic", "coloredlogs", "freezegun", "nacl", "numpy", "pyrfc3339", "pytest", "pytz", "sqlalchemy", "yaml", "youtube_dl"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
